<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor — SiteForge</title>
<link rel="stylesheet" href="/vendor/grapes.min.css">
<script src="/vendor/grapes.min.js" defer></script>
<script src="/vendor/purify.min.js" defer></script>
<script src="/editor.js" defer></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px system-ui;background:#353535;color:#eee}body{display:flex;flex-direction:column}.topbar{padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#202126;border-bottom:1px solid #50515b}.topbar a{color:#c2c4ff}.topbar button,dialog button{background:#5b54cd;color:#fff;border:0;border-radius:5px;padding:9px 14px;cursor:pointer;font:inherit}.topbar button:disabled,dialog button:disabled{opacity:.5;cursor:wait}#status{margin-left:auto;color:#e1e3f7}#gjs{flex:1;min-height:0}#boot{padding:30px}dialog{color:#e8eaf2;background:#242631;border:1px solid #5b6075;border-radius:10px;width:min(640px,90vw)}dialog::backdrop{background:#0009}dialog textarea{width:100%;height:160px;display:block;background:#151823;color:#fff;border:1px solid #5b6075;border-radius:5px;margin:12px 0;padding:12px;font:inherit}dialog .actions{display:flex;justify-content:flex-end;gap:12px}#error{color:#ffa5a5;min-height:24px}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #c3c0ff;outline-offset:3px}@media(max-width:600px){.topbar{gap:6px}.topbar button{padding:8px}#status{width:100%;margin:0}}
</style>
</head>
<body>
<header class="topbar">
<a href="/" id="home">Projects</a>
<button id="save" disabled>Save</button>
<button id="download" disabled>Download HTML</button>
<button id="refine" disabled>Refine with AI</button>
<span id="status" role="status" aria-live="polite">Loading website…</span>
</header>
<div id="boot">Loading your website into the editor…</div>
<div id="gjs"></div>
<dialog id="refine-dialog">
<form id="refine-form">
<h2>Refine with AI</h2>
<label for="instruction">What would you like to change?</label>
<textarea id="instruction" required maxlength="4000" placeholder="Make the hero darker and add a testimonials section"></textarea>
<p>Your current canvas, including unsaved edits, will be sent to your configured AI provider.</p>
<p id="error" role="alert"></p>
<div class="actions"><button type="button" id="cancel">Cancel</button><button type="submit" id="apply">Apply change</button></div>
</form>
</dialog>
</body>
</html>
